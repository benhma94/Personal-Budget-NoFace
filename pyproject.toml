[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "Personal portfolio tracker: positions, exposure, MWR vs benchmark, risk suite"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "lseg-data>=2.1,<3",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
finance-hub = "finance_hub.cli:main"
portfolio-tracker = "portfolio_tracker.cli:main"
budget-dashboard = "budget_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_hub = ["assets/*"]
budget_dashboard = ["profile.example.json"]
portfolio_tracker = ["symbols.example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv]
python-preference = "only-managed"
